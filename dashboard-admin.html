<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - النظام المتكامل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ====== التنسيقات الأساسية ====== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 16px; padding: 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        h1 { color: #1a2a3a; border-bottom: 3px solid #2d7aff; padding-bottom: 12px; margin-bottom: 25px; }
        .nav-bar { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; background: #eef2f7; padding: 15px; border-radius: 12px; }
        .nav-btn { background: white; border: none; padding: 12px 28px; border-radius: 30px; font-size: 16px; font-weight: 600; color: #1a2a3a; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.08); transition: 0.3s; border: 1px solid transparent; }
        .nav-btn:hover { background: #2d7aff; color: white; box-shadow: 0 6px 14px rgba(45,122,255,0.3); transform: translateY(-2px); }
        .nav-btn.logout { background: #ff4d4d; color: white; }
        .nav-btn.logout:hover { background: #cc0000; }

        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ====== الفلاتر ====== */
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; background: #f8faff; padding: 15px; border-radius: 12px; align-items: center; }
        .filters label { font-weight: 600; color: #1a2a3a; }
        .filters input, .filters select { padding: 8px 14px; border: 1px solid #dce1e8; border-radius: 8px; font-size: 14px; }
        .filters button { background: #2d7aff; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .filters button:hover { background: #1a5cc4; }
        .filters button.reset { background: #6c757d; }

        /* ====== الجداول ====== */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        th { background: #2d7aff; color: white; padding: 12px 10px; text-align: center; font-weight: 600; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #e9edf4; text-align: center; vertical-align: middle; }
        tr:hover td { background: #f8faff; }
        .status-badge { padding: 4px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; display: inline-block; }
        .status-new { background: #ffc107; color: #000; }
        .status-in_progress { background: #17a2b8; color: #fff; }
        .status-contacted { background: #28a745; color: #fff; }
        .status-resolved { background: #6c757d; color: #fff; }
        .status-default { background: #e9ecef; color: #000; }

        .btn-preview { background: #17a2b8; color: white; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-preview:hover { background: #138496; }
        .btn-save-assign { background: #28a745; color: white; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-save-assign:hover { background: #218838; }
        select.assigned-select { padding: 4px 8px; border-radius: 6px; border: 1px solid #dce1e8; font-size: 13px; width: 100%; max-width: 200px; }

        /* ====== الموظفين ====== */
        .employee-card { background: #f8faff; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid #2d7aff; }
        .employee-card .info { display: flex; gap: 30px; flex-wrap: wrap; }
        .employee-card .info strong { color: #1a2a3a; }
        .status-badge { background: #28a745; color: white; padding: 4px 16px; border-radius: 30px; font-size: 13px; }
        .status-badge.inactive { background: #dc3545; }

        .message { padding: 16px; background: #fff3cd; border-radius: 10px; border-right: 6px solid #ffc107; margin: 20px 0; }
        .message.error { background: #f8d7da; border-color: #dc3545; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }

        /* ====== نافذة المعاينة المنبثقة (Modal) ====== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeInModal 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeInModal { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 800px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: left;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: #c82333; }
        .modal-title { font-size: 24px; color: #1a2a3a; border-bottom: 2px solid #2d7aff; padding-bottom: 12px; margin-bottom: 20px; }
        .modal-section { margin-bottom: 20px; }
        .modal-section h3 { color: #2d7aff; margin-bottom: 10px; font-size: 18px; border-bottom: 1px solid #e9edf4; padding-bottom: 6px; }
        .modal-detail-row { display: flex; padding: 6px 0; border-bottom: 1px dashed #f0f2f5; }
        .modal-detail-row .label { font-weight: 600; width: 130px; color: #1a2a3a; }
        .modal-detail-row .value { flex: 1; color: #333; }
        .followup-item { background: #f8faff; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; border-right: 3px solid #2d7aff; }
        .followup-item .date { font-size: 12px; color: #6c757d; }
        .followup-item .note { margin-top: 4px; }
        .add-followup-form { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .add-followup-form input, .add-followup-form textarea { flex: 1; min-width: 150px; padding: 8px 12px; border: 1px solid #dce1e8; border-radius: 6px; }
        .add-followup-form button { background: #28a745; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; }

        @media (max-width: 700px) { .nav-bar { flex-direction: column; } .nav-btn { width: 100%; text-align: center; } .filters { flex-direction: column; align-items: stretch; } .employee-card { flex-direction: column; align-items: flex-start; gap: 10px; } .modal-content { padding: 15px; } .modal-detail-row { flex-direction: column; } .modal-detail-row .label { width: 100%; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ لوحة تحكم المدير</h1>
    <div class="nav-bar">
        <button class="nav-btn" id="btnShowConsultations">📋 عرض كل الطلبات</button>
        <button class="nav-btn" id="btnShowEmployees">👥 إدارة الموظفين</button>
        <button class="nav-btn logout" id="btnLogout">🚪 تسجيل الخروج</button>
    </div>

    <!-- ====== قسم الاستشارات ====== -->
    <div id="sectionConsultations" class="section active">
        <h2>📋 جميع استشارات العملاء</h2>
        <div class="filters" id="filterContainer">
            <label>📅 من:</label><input type="date" id="filterDateFrom">
            <label>إلى:</label><input type="date" id="filterDateTo">
            <label>📌 الحالة:</label>
            <select id="filterStatus">
                <option value="">الكل</option>
                <option value="new">جديد</option>
                <option value="in_progress">قيد المتابعة</option>
                <option value="contacted">تم التواصل</option>
                <option value="resolved">تم الحل</option>
            </select>
            <label>👤 الموظف:</label>
            <select id="filterEmployee"><option value="">الكل</option></select>
            <button id="btnApplyFilters">🔍 تطبيق</button>
            <button id="btnResetFilters" class="reset">↺ إعادة تعيين</button>
        </div>
        <div id="consultationsContainer"><div class="loading">⏳ جاري التحميل...</div></div>
    </div>

    <!-- ====== قسم الموظفين ====== -->
    <div id="sectionEmployees" class="section">
        <h2>👥 إدارة الموظفين</h2>
        <div id="employeesContainer"><div class="loading">⏳ جاري التحميل...</div></div>
    </div>
</div>

<!-- ====== نافذة المعاينة المنبثقة ====== -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-title" id="modalTitle">تفاصيل الطلب</div>
        <div id="modalBody">
            <!-- سيتم ملؤها بواسطة الجافا سكريبت -->
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // 🔑 إعدادات Supabase (ضع المفتاح العام الصحيح)
        // ============================================================
        const SUPABASE_URL = 'https://wacvbnebicbutyzpnkez.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY3ZibmViaWNidXR5enBua2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODYzMjEsImV4cCI6MjEwMTc2MjMyMX0.NEjwCs4ZBcoJT9ZVxNnYaZRY1-DIUjk-aNqV3rs5A4w';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // متغيرات عامة
        // ============================================================
        let allConsultations = [];
        let allEmployees = [];
        let currentFilteredData = [];

        // ============================================================
        // دوال العرض
        // ============================================================

        function renderConsultations(data, employees) {
            const container = document.getElementById('consultationsContainer');
            if (!container) return;
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="message">📭 لا توجد استشارات تطابق الفلتر.</div>`;
                return;
            }

            let rows = '';
            data.forEach((item, idx) => {
                const statusClass = 'status-' + (item.status || 'new').replace('_', '');
                const assignedName = employees ? employees.find(e => e.id === item.assigned_to)?.full_name || 'غير محدد' : 'غير محدد';

                rows += `
                    <tr data-id="${item.id}">
                        <td>${idx + 1}</td>
                        <td>${item.client_name || 'غير محدد'}</td>
                        <td>${item.email || '—'}</td>
                        <td>${item.phone || '—'}</td>
                        <td><span class="status-badge ${statusClass}">${item.status || 'جديد'}</span></td>
                        <td>${item.created_at ? new Date(item.created_at).toLocaleDateString('ar-EG') : '—'}</td>
                        <td>
                            <select class="assigned-select" data-id="${item.id}">
                                <option value="">غير محدد</option>
                                ${employees ? employees.map(emp => `<option value="${emp.id}" ${emp.id === item.assigned_to ? 'selected' : ''}>${emp.full_name}</option>`).join('') : ''}
                            </select>
                            <button class="btn-save-assign" data-id="${item.id}">حفظ</button>
                        </td>
                        <td><button class="btn-preview" data-id="${item.id}">📄 معاينة</button></td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="table-responsive">
                    <table>
                        <thead><tr>
                            <th>#</th><th>اسم العميل</th><th>البريد</th><th>الهاتف</th><th>الحالة</th><th>التاريخ</th>
                            <th>المتابع</th><th>الإجراء</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;

            // ربط أزرار حفظ التعيين
            document.querySelectorAll('.btn-save-assign').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const consultationId = this.dataset.id;
                    const select = document.querySelector(`.assigned-select[data-id="${consultationId}"]`);
                    const assignedTo = select.value || null;
                    if (!assignedTo && !confirm('هل أنت متأكد من إزالة التعيين؟')) return;
                    const { error } = await supabase
                        .from('consultation_requests')
                        .update({ assigned_to: assignedTo })
                        .eq('id', consultationId);
                    if (error) {
                        alert('❌ فشل حفظ التعيين: ' + error.message);
                    } else {
                        alert('✅ تم حفظ التعيين بنجاح!');
                        applyFilters();
                    }
                });
            });

            // ربط أزرار المعاينة
            document.querySelectorAll('.btn-preview').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    openPreview(id);
                });
            });

            populateEmployeeFilter(employees);
        }

        function renderEmployees(data) {
            const container = document.getElementById('employeesContainer');
            if (!container) return;
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="message">👤 لا يوجد موظفون مسجلون.</div>`;
                return;
            }
            let cards = '';
            data.forEach(emp => {
                const isActive = emp.is_active === true;
                const statusClass = isActive ? '' : 'inactive';
                const statusText = isActive ? 'نشط' : 'غير نشط';
                cards += `
                    <div class="employee-card">
                        <div class="info">
                            <strong>${emp.full_name || 'بدون اسم'}</strong>
                            <span>📧 ${emp.email}</span>
                            <span>🔹 ${emp.role || 'موظف'}</span>
                        </div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                `;
            });
            container.innerHTML = `
                <div style="margin-bottom:20px;">
                    <button class="nav-btn" id="btnAddEmployee" style="background:#28a745; color:white;">➕ إضافة موظف جديد</button>
                </div>
                ${cards}
            `;
            document.getElementById('btnAddEmployee')?.addEventListener('click', function() {
                alert('🚧 سيتم تفعيل إضافة الموظفين قريباً.');
            });
        }

        // ============================================================
        // نافذة المعاينة الكاملة
        // ============================================================

        async function openPreview(consultationId) {
            const modal = document.getElementById('previewModal');
            const body = document.getElementById('modalBody');
            const title = document.getElementById('modalTitle');

            modal.classList.add('active');
            body.innerHTML = `<div class="loading">⏳ جاري تحميل التفاصيل...</div>`;

            try {
                // جلب بيانات الاستشارة
                const { data: consultation, error: conError } = await supabase
                    .from('consultation_requests')
                    .select('*')
                    .eq('id', consultationId)
                    .single();

                if (conError || !consultation) {
                    body.innerHTML = `<div class="message error">❌ حدث خطأ في جلب البيانات: ${conError?.message}</div>`;
                    return;
                }

                // جلب المتابعات المرتبطة بهذه الاستشارة
                const { data: followups, error: folError } = await supabase
                    .from('client_followups')
                    .select('*')
                    .eq('consultation_id', consultationId)
                    .order('created_at', { ascending: false });

                if (folError) {
                    console.warn('خطأ في جلب المتابعات:', folError);
                }

                // جلب اسم الموظف المسند
                let assignedName = 'غير محدد';
                if (consultation.assigned_to) {
                    const { data: emp } = await supabase
                        .from('staff_profiles')
                        .select('full_name')
                        .eq('id', consultation.assigned_to)
                        .single();
                    if (emp) assignedName = emp.full_name;
                }

                // بناء HTML لعرض التفاصيل
                let html = `
                    <div class="modal-section">
                        <h3>📌 معلومات العميل</h3>
                        <div class="modal-detail-row"><span class="label">الاسم</span><span class="value">${consultation.client_name || 'غير محدد'}</span></div>
                        <div class="modal-detail-row"><span class="label">البريد الإلكتروني</span><span class="value">${consultation.email || '—'}</span></div>
                        <div class="modal-detail-row"><span class="label">رقم الهاتف</span><span class="value">${consultation.phone || '—'}</span></div>
                        <div class="modal-detail-row"><span class="label">الحالة</span><span class="value">${consultation.status || 'جديد'}</span></div>
                        <div class="modal-detail-row"><span class="label">تاريخ الطلب</span><span class="value">${consultation.created_at ? new Date(consultation.created_at).toLocaleString('ar-EG') : '—'}</span></div>
                        <div class="modal-detail-row"><span class="label">الموظف المسند</span><span class="value">${assignedName}</span></div>
                        ${consultation.message ? `<div class="modal-detail-row"><span class="label">الرسالة</span><span class="value">${consultation.message}</span></div>` : ''}
                    </div>
                `;

                // سجل المتابعات
                html += `<div class="modal-section"><h3>📋 سجل المتابعات</h3>`;
                if (followups && followups.length > 0) {
                    followups.forEach(f => {
                        const date = f.created_at ? new Date(f.created_at).toLocaleString('ar-EG') : '—';
                        html += `
                            <div class="followup-item">
                                <div class="date">${date}</div>
                                <div class="note"><strong>${f.note || 'ملاحظة'}</strong></div>
                                ${f.status ? `<div style="font-size:12px;color:#6c757d;">الحالة: ${f.status}</div>` : ''}
                            </div>
                        `;
                    });
                } else {
                    html += `<div class="message">لا توجد متابعات مسجلة لهذا الطلب.</div>`;
                }
                html += `</div>`;

                // نموذج إضافة متابعة جديدة
                html += `
                    <div class="modal-section">
                        <h3>➕ إضافة متابعة جديدة</h3>
                        <div class="add-followup-form">
                            <input type="text" id="newFollowupNote" placeholder="ملاحظة المتابعة" style="flex:2;">
                            <input type="text" id="newFollowupStatus" placeholder="الحالة (اختياري)" style="flex:1;">
                            <button id="btnAddFollowup" data-id="${consultationId}">إضافة</button>
                        </div>
                    </div>
                `;

                body.innerHTML = html;

                // ربط زر إضافة المتابعة
                document.getElementById('btnAddFollowup')?.addEventListener('click', async function() {
                    const consId = this.dataset.id;
                    const note = document.getElementById('newFollowupNote').value.trim();
                    const status = document.getElementById('newFollowupStatus').value.trim() || null;

                    if (!note) {
                        alert('يرجى كتابة ملاحظة المتابعة');
                        return;
                    }

                    const { error } = await supabase
                        .from('client_followups')
                        .insert({
                            consultation_id: consId,
                            note: note,
                            status: status,
                            created_at: new Date().toISOString()
                        });

                    if (error) {
                        alert('❌ فشل إضافة المتابعة: ' + error.message);
                    } else {
                        alert('✅ تم إضافة المتابعة بنجاح!');
                        // إعادة فتح المعاينة لتحديث السجل
                        openPreview(consId);
                    }
                });

            } catch (err) {
                body.innerHTML = `<div class="message error">❌ حدث خطأ غير متوقع: ${err.message}</div>`;
            }
        }

        // إغلاق النافذة المنبثقة
        document.getElementById('modalClose').addEventListener('click', function() {
            document.getElementById('previewModal').classList.remove('active');
        });
        document.getElementById('previewModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        // ============================================================
        // دوال جلب البيانات والفلاتر
        // ============================================================

        async function fetchEmployees() {
            try {
                const { data, error } = await supabase
                    .from('staff_profiles')
                    .select('*')
                    .order('full_name', { ascending: true });
                if (error) throw error;
                allEmployees = data || [];
                renderEmployees(allEmployees);
                populateEmployeeFilter(allEmployees);
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchConsultations() {
            try {
                const { data, error } = await supabase
                    .from('consultation_requests')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) throw error;
                allConsultations = data || [];
                applyFilters();
            } catch (err) {
                console.error(err);
                document.getElementById('consultationsContainer').innerHTML = `<div class="message error">❌ ${err.message}</div>`;
            }
        }

        function populateEmployeeFilter(employees) {
            const filterSelect = document.getElementById('filterEmployee');
            if (!filterSelect) return;
            const currentValue = filterSelect.value;
            filterSelect.innerHTML = '<option value="">الكل</option>';
            if (employees) {
                employees.forEach(emp => {
                    filterSelect.innerHTML += `<option value="${emp.id}">${emp.full_name}</option>`;
                });
            }
            filterSelect.value = currentValue;
        }

        function applyFilters() {
            const dateFrom = document.getElementById('filterDateFrom')?.value || '';
            const dateTo = document.getElementById('filterDateTo')?.value || '';
            const status = document.getElementById('filterStatus')?.value || '';
            const employeeId = document.getElementById('filterEmployee')?.value || '';

            let filtered = [...allConsultations];

            if (dateFrom) {
                const from = new Date(dateFrom); from.setHours(0,0,0,0);
                filtered = filtered.filter(item => item.created_at && new Date(item.created_at) >= from);
            }
            if (dateTo) {
                const to = new Date(dateTo); to.setHours(23,59,59,999);
                filtered = filtered.filter(item => item.created_at && new Date(item.created_at) <= to);
            }
            if (status) filtered = filtered.filter(item => item.status === status);
            if (employeeId) filtered = filtered.filter(item => item.assigned_to === employeeId);

            currentFilteredData = filtered;
            renderConsultations(filtered, allEmployees);
        }

        // ============================================================
        // دوال التنقل والخروج
        // ============================================================

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(sectionId);
            if (target) target.classList.add('active');
            if (sectionId === 'sectionConsultations') {
                if (allConsultations.length === 0) fetchConsultations();
                else applyFilters();
            } else if (sectionId === 'sectionEmployees') {
                if (allEmployees.length === 0) fetchEmployees();
                else renderEmployees(allEmployees);
            }
        }

        async function handleLogout() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) alert('❌ ' + error.message);
                else window.location.href = 'login.html';
            } catch (e) {
                alert('❌ حدث خطأ أثناء تسجيل الخروج');
                console.error(e);
            }
        }

        // ============================================================
        // تهيئة الصفحة
        // ============================================================

        document.addEventListener('DOMContentLoaded', async function() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                alert('يرجى تسجيل الدخول أولاً.');
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('btnShowConsultations').addEventListener('click', () => showSection('sectionConsultations'));
            document.getElementById('btnShowEmployees').addEventListener('click', () => showSection('sectionEmployees'));
            document.getElementById('btnLogout').addEventListener('click', handleLogout);

            document.getElementById('btnApplyFilters').addEventListener('click', applyFilters);
            document.getElementById('btnResetFilters').addEventListener('click', function() {
                document.getElementById('filterDateFrom').value = '';
                document.getElementById('filterDateTo').value = '';
                document.getElementById('filterStatus').value = '';
                document.getElementById('filterEmployee').value = '';
                applyFilters();
            });

            document.getElementById('filterDateFrom').addEventListener('change', applyFilters);
            document.getElementById('filterDateTo').addEventListener('change', applyFilters);
            document.getElementById('filterStatus').addEventListener('change', applyFilters);
            document.getElementById('filterEmployee').addEventListener('change', applyFilters);

            await fetchEmployees();
            await fetchConsultations();
        });

    })();
</script>
</body>
</html>
